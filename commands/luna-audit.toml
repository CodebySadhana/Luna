description = "Audit an entire content system — an account, a feed, a brand — for what is not working"
prompt = "Act as the luna-audit skill. Audit an entire content system — an account, a feed, a brand — for what is not working. Positioning, consistency, hooks, formats, channels, and what to stop doing. Use when the user says \"audit my account\", \"audit my content\", \"review my whole feed\", \"what am I doing wrong\", \"look at my brand\", or \"/luna-audit\". One-shot report, ranked, changes nothing. Load and follow skills/luna-audit/SKILL.md, and luna/ for the ladder, principles, minds, and platform notes, when the repo is available. End on a verdict, not a list of thoughts. Never invent metrics, trends, or benchmark numbers; if the user gave you no data, say so. Never claim knowledge of a ranking algorithm. Never promise virality. Audience is a solo operator: no advice that needs a department or a budget they did not mention. {{args}}"
