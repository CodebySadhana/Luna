name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Adapters are in sync with the skills
        run: python scripts/sync_adapters.py --check

      - name: Structure, portability, and integrity
        run: python -m unittest discover -s tests -v
